<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram Profile Generator</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f4f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
    color: #0f1419;
}

.app {
    display: flex;
    min-height: 100vh;
}

/* =========================
   왼쪽 편집창
========================= */

.editor {
    width: 275px;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid #ddd;
    padding: 20px 16px;
}

.editor h1 {
    font-size: 17px;
    margin: 0 0 22px;
}

.section {
    margin-bottom: 24px;
}

.section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .7px;
    color: #888;
    margin-bottom: 11px;
    text-transform: uppercase;
}

label {
    font-size: 12px;
    color: #555;
    display: block;
    margin-bottom: 5px;
}

input,
textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 7px;
    padding: 8px;
    margin-bottom: 10px;
    font-size: 13px;
    outline: none;
    background: white;
}

textarea {
    resize: vertical;
    min-height: 65px;
}

input:focus,
textarea:focus {
    border-color: #999;
}

.stats-inputs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}

.upload {
    display: block;
    border: 1px dashed #ccc;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    background: #fafafa;
    margin-bottom: 8px;
}

.upload:hover {
    background: #f3f3f3;
}

.upload input {
    display: none;
}

/* 하이라이트 토글 */

.toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #e2e2e2;
    border-radius: 9px;
    padding: 10px;
    margin-bottom: 12px;
    font-size: 13px;
}

.switch {
    position: relative;
    width: 40px;
    height: 23px;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #d4d4d4;
    border-radius: 30px;
    cursor: pointer;
    transition: .2s;
}

.slider::before {
    content: "";
    position: absolute;
    width: 19px;
    height: 19px;
    left: 2px;
    top: 2px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    transition: .2s;
}

.switch input:checked + .slider {
    background: #0095f6;
}

.switch input:checked + .slider::before {
    transform: translateX(17px);
}

.save {
    width: 100%;
    border: none;
    border-radius: 8px;
    background: #0095f6;
    color: white;
    padding: 11px;
    font-weight: 700;
    cursor: pointer;
}

/* =========================
   오른쪽
========================= */

.preview-area {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 35px;
}

.instagram {
    width: 500px;
    background: #fff;
    overflow: hidden;
    box-shadow: 0 3px 20px rgba(0,0,0,.08);
}

/* =========================
   상태바
========================= */

.statusbar {
    height: 62px;
    padding: 17px 27px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-size: 20px;
    font-weight: 650;
}

.status-icons {
    display: flex;
    align-items: center;
    gap: 9px;
}

.signal {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 16px;
}

.signal span {
    width: 4px;
    background: #0f1419;
    border-radius: 2px;
}

.signal span:nth-child(1) { height: 6px; }
.signal span:nth-child(2) { height: 9px; }
.signal span:nth-child(3) { height: 12px; }
.signal span:nth-child(4) { height: 16px; }

.wifi {
    width: 21px;
    height: 16px;
    position: relative;
}

.wifi::before,
.wifi::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border: 3px solid #0f1419;
    border-left-color: transparent;
    border-right-color: transparent;
    border-bottom-color: transparent;
    border-radius: 50%;
}

.wifi::before {
    width: 22px;
    height: 18px;
}

.wifi::after {
    top: 6px;
    width: 11px;
    height: 9px;
}

.battery {
    width: 34px;
    height: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #aaa;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
}

/* =========================
   인스타 상단
========================= */

.instagram-nav {
    height: 78px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 4px 25px 0;
}

.nav-left {
    display: flex;
    justify-content: flex-start;
}

.nav-center {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-width: 0;
}

.nav-username {
    font-size: 17px;
    font-weight: 700;
    max-width: 165px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.nav-right {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 25px;
}

.svg-icon {
    width: 29px;
    height: 29px;
    stroke: #101418;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.plus-icon {
    width: 31px;
    height: 31px;
}

.arrow-icon {
    width: 18px;
    height: 18px;
    stroke-width: 2.7;
}

/* =========================
   프로필
========================= */

.profile-main {
    padding: 4px 22px 0;
}

.profile-row {
    display: grid;
    grid-template-columns: 125px 1fr;
    align-items: center;
}

.avatar-wrap {
    display: flex;
    justify-content: flex-start;
}

.avatar {
    width: 112px;
    height: 112px;
    object-fit: cover;
    border-radius: 50%;
    background: #eef0f4;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    text-align: center;
    gap: 4px;
}

.stat-number {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 1px;
}

.stat-label {
    font-size: 16px;
    line-height: 1.2;
}

/* 소개 */

.bio {
    padding-top: 15px;
    font-size: 14px;
    line-height: 1.35;
}

.profile-name {
    font-weight: 650;
    margin-bottom: 3px;
}

.bio-text {
    white-space: pre-line;
}

.profile-link {
    margin-top: 3px;
    color: #00376b;
    font-weight: 600;
}

/* =========================
   Add banners
========================= */

.banner-row {
    padding: 19px 22px 16px;
}

.add-banner {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid #d6d9dc;
    border-radius: 22px;
    padding: 7px 13px;
    color: #646b73;
    font-size: 14px;
    font-weight: 600;
}

.small-plus {
    width: 18px;
    height: 18px;
    position: relative;
}

.small-plus::before,
.small-plus::after {
    content: "";
    position: absolute;
    background: #646b73;
    border-radius: 3px;
}

.small-plus::before {
    width: 16px;
    height: 2px;
    left: 1px;
    top: 8px;
}

.small-plus::after {
    width: 2px;
    height: 16px;
    left: 8px;
    top: 1px;
}

/* =========================
   버튼
========================= */

.profile-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    padding: 0 22px;
}

.profile-button {
    height: 42px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f0f1f4;
    border-radius: 7px;
    font-size: 16px;
    font-weight: 650;
}

/* =========================
   하이라이트
========================= */

.highlights-wrapper {
    padding-top: 20px;
}

.highlights {
    min-height: 83px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 0 22px 17px;
    overflow-x: auto;
    scrollbar-width: none;
}

.highlights::-webkit-scrollbar {
    display: none;
}

.highlight {
    width: 72px;
    flex-shrink: 0;
    text-align: center;
    font-size: 11px;
}

.highlight-ring {
    width: 66px;
    height: 66px;
    margin: 0 auto;
    border-radius: 50%;
    border: 1px solid #d8d8d8;
    padding: 3px;
    background: white;
}

.highlight img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}

.highlight-name {
    margin-top: 5px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.add-highlight-circle {
    width: 66px;
    height: 66px;
    margin: 0 auto;
    border-radius: 50%;
    border: 1px solid #d6d6d6;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    font-weight: 300;
}

/* =========================
   탭
========================= */

.tabs {
    height: 58px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: center;
    border-bottom: 1px solid #efefef;
}

.tab {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.tab.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 48%;
    height: 2px;
    background: #111;
}

.grid-icon {
    width: 25px;
    height: 25px;
}

.reels-icon {
    width: 29px;
    height: 29px;
    stroke: #737981;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.tag-icon {
    width: 28px;
    height: 28px;
    stroke: #737981;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================
   게시물
========================= */

.posts {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 2px;
}

.post {
    aspect-ratio: 1/1;
    overflow: hidden;
    background: #f2f2f2;
}

.post img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* =========================
   모바일
========================= */

@media(max-width:800px) {
    .app {
        display: block;
    }

    .editor {
        position: relative;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #ddd;
    }

    .preview-area {
        padding: 15px;
    }

    .instagram {
        width: 100%;
        max-width: 500px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- 왼쪽 편집창 -->

<aside class="editor">

<h1>Instagram Mockup</h1>

<div class="section">
    <div class="section-title">Profile</div>

    <label>아이디</label>
    <input id="usernameInput" value="yourusername">

    <label>이름</label>

    <label>소개</label>
    <textarea id="bioInput">my little archive
memories & daily life</textarea>

    <label>링크</label>
    <input id="linkInput" value="example.com">

    <label class="upload">
        프로필 사진 선택
        <input id="profileUpload" type="file" accept="image/*">
    </label>
</div>

<div class="section">
    <div class="section-title">Stats</div>

    <div class="stats-inputs">
        <div>
            <label>게시물</label>
            <input id="postsCountInput" value="0">
        </div>

        <div>
            <label>팔로워</label>

        </div>

        <div>
            <label>팔로잉</label>
            <input id="followingInput" value="0">
        </div>
    </div>
</div>

<div class="section">

    <div class="section-title">Highlights</div>

    <div class="toggle-row">
        <span>하이라이트 표시</span>

        <label class="switch">
            <input type="checkbox" id="highlightToggle" checked>
            <span class="slider"></span>

        <label class="upload">

            <input id="highlightUpload" type="file" accept="image/*">
        </label>

    </div>

</div>

<div class="section">
    <div class="section-title">Posts</div>

    <label class="upload">
        게시물 사진 추가
        <input id="postsUpload" type="file" accept="image/*" multiple>
    </label>
</div>

<button class="save" id="saveButton">
PNG 저장
</button>

</aside>

<!-- 오른쪽 인스타 미리보기 -->

<main class="preview-area">

<div class="instagram" id="captureArea">

<!-- 상태바 -->

<div class="statusbar">

    <div>11:04</div>

    <div class="status-icons">

        <div class="signal">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="wifi"></div>

        <div class="battery">30</div>

    </div>

</div>

<!-- 인스타 상단 -->

<div class="instagram-nav">

    <div class="nav-left">

        <svg class="svg-icon plus-icon" viewBox="0 0 24 24">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
        </svg>

    </div>

    <div class="nav-center">

        <div class="nav-username" id="topUsername">
            yourusername
        </div>

        <svg class="svg-icon arrow-icon" viewBox="0 0 24 24">
            <path d="m7 9 5 5 5-5"></path>
        </svg>

    </div>

    <div class="nav-right">

        <svg class="svg-icon" viewBox="0 0 24 24">
            <path d="M15.5 8.4c-1-1.2-2.4-1.8-4-1.8-3.1 0-5.4 2.2-5.4 5.4 0 3.5 2.5 5.6 5.6 5.6 2.8 0 5.1-1.7 5.1-4.1 0-2-1.5-3.3-3.8-3.3-2.1 0-3.7 1.2-3.7 2.8 0 1.5 1.2 2.6 2.9 2.6 2.6 0 4.5-1.9 4.5-5.1 0-4.2-2.5-6.7-6.5-6.7"></path>
        </svg>

        <svg class="svg-icon" viewBox="0 0 24 24">
            <path d="M4 7h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 17h16"></path>
        </svg>

    </div>

</div>

<div class="profile-main">

    <div class="profile-row">

        <div class="avatar-wrap">

            <img
                id="profileImage"
                class="avatar"

<!-- Add banners -->

            <path d="M4 8h16"></path>

        <svg class="tag-icon" viewBox="0 0 24 24">

            <rect x="4" y="3" width="16" height="18" rx="4"></rect>

        </svg>

    </div>

</div>

<!-- 게시물 -->

<div class="posts" id="postsContainer"></div>

</div>

</main>

</div>

<script>

/* =========================
입력
========================= */

const usernameInput = document.getElementById("usernameInput");
const nameInput = document.getElementById("nameInput");
const bioInput = document.getElementById("bioInput");
const linkInput = document.getElementById("linkInput");

const postsCountInput = document.getElementById("postsCountInput");
const followersInput = document.getElementById("followersInput");
const followingInput = document.getElementById("followingInput");

const topUsername = document.getElementById("topUsername");
const profileName = document.getElementById("profileName");
const profileBio = document.getElementById("profileBio");
const profileLink = document.getElementById("profileLink");

const postsCount = document.getElementById("postsCount");
const followersCount = document.getElementById("followersCount");
const followingCount = document.getElementById("followingCount");

usernameInput.addEventListener("input", () => {
    topUsername.textContent = usernameInput.value || "username";
});

nameInput.addEventListener("input", () => {
    profileName.textContent = nameInput.value;
});

bioInput.addEventListener("input", () => {
    profileBio.textContent = bioInput.value;
});

linkInput.addEventListener("input", () => {
    profileLink.textContent = linkInput.value;

    profileLink.style.display =
        linkInput.value ? "block" : "none";
});

postsCountInput.addEventListener("input", () => {
    postsCount.textContent = postsCountInput.value;
});

followersInput.addEventListener("input", () => {
    followersCount.textContent = followersInput.value;
});

followingInput.addEventListener("input", () => {
    followingCount.textContent = followingInput.value;
});

/* =========================
프로필 이미지
========================= */

const profileUpload = document.getElementById("profileUpload");
const profileImage = document.getElementById("profileImage");

profileUpload.addEventListener("change", () => {

    const file = profileUpload.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = e => {
        profileImage.src = e.target.result;
    };

    reader.readAsDataURL(file);

});

/* =========================
하이라이트 표시/숨기기
========================= */

const highlightToggle = document.getElementById("highlightToggle");
const highlightsWrapper = document.getElementById("highlightsWrapper");
const highlightEditor = document.getElementById("highlightEditor");

highlightToggle.addEventListener("change", () => {

    if (highlightToggle.checked) {

        highlightsWrapper.style.display = "block";
        highlightEditor.style.display = "block";

    } else {

        highlightsWrapper.style.display = "none";
        highlightEditor.style.display = "none";

    }

});

/* =========================
하이라이트 추가
========================= */

const highlightUpload = document.getElementById("highlightUpload");
const highlightNameInput = document.getElementById("highlightNameInput");
const highlightsContainer = document.getElementById("highlightsContainer");

highlightUpload.addEventListener("change", () => {

    const file = highlightUpload.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = e => {

        const item = document.createElement("div");
        item.className = "highlight";

        const ring = document.createElement("div");
        ring.className = "highlight-ring";

        const img = document.createElement("img");
        img.src = e.target.result;

        const name = document.createElement("div");
        name.className = "highlight-name";
        name.textContent =
            highlightNameInput.value || "highlight";

        ring.appendChild(img);

        item.appendChild(ring);
        item.appendChild(name);

        const newCircle =
            highlightsContainer.querySelector(".highlight:last-child");

        highlightsContainer.insertBefore(
            item,
            newCircle
        );

    };

    reader.readAsDataURL(file);

});

/* =========================
게시물
========================= */

const postsUpload = document.getElementById("postsUpload");
const postsContainer = document.getElementById("postsContainer");

postsUpload.addEventListener("change", () => {

    const files = Array.from(postsUpload.files);

    if (!files.length) return;

    postsContainer.innerHTML = "";

    files.forEach(file => {

        const reader = new FileReader();

        reader.onload = e => {

            const post = document.createElement("div");
            post.className = "post";

            const img = document.createElement("img");
            img.src = e.target.result;

            post.appendChild(img);

            postsContainer.appendChild(post);

        };

        reader.readAsDataURL(file);

    });

    postsCountInput.value = files.length;
    postsCount.textContent = files.length;

});

/* =========================
PNG 저장
========================= */

document
.getElementById("saveButton")
.addEventListener("click", async () => {

    const target =
        document.getElementById("captureArea");

    const canvas =
        await html2canvas(
            target,
            {
                scale: 3,
                backgroundColor: "#ffffff",
                useCORS: true
            }
        );

    const link =
        document.createElement("a");

    link.download =
        `${usernameInput.value || "instagram-profile"}.png`;

    link.href =
        canvas.toDataURL("image/png");

    link.click();

});

</script>
